aid: interfaze
name: Interfaze
description: >-
  Interfaze is a Y Combinator (P26) startup building a new model architecture for deterministic
  developer tasks. Interfaze-beta is a multimodal, OpenAI-compatible Chat Completion API (a hybrid
  Mixture-of-Architecture combining specialized DNN/CNN vision and audio models with a transformer
  layer) tuned for high accuracy, precision, and consistency on jobs like OCR, speech-to-text,
  strict structured/JSON output, object detection with bounding boxes, web search, and web scraping
  through a single endpoint. It exposes a 1M-token context window, 32k max output, verifiable outputs
  with confidence scores, built-in sandboxed compute and headless browser tools, and works with the
  OpenAI, Vercel AI, and LangChain SDKs by swapping the base URL. Founded in 2025 by Yoeven D Khemlani
  and Harsha Vardhan Khurdula (evolved from JigsawStack) and based in San Francisco.
